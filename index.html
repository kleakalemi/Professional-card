<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klea Kalemi | Contact</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;

      background: #f4f3f0;
      color: #26383f;

      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;

      padding: 50px 45px;

      border: 1px solid #dedbd3;

      box-shadow: 0 20px 50px rgba(30, 40, 45, 0.08);

      position: relative;
    }

    .gold-line {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 3px;

      background: #ad9364;
    }

    .monogram {
      font-family: Georgia, serif;

      font-size: 22px;
      letter-spacing: 5px;

      color: #ad9364;

      margin-bottom: 30px;
    }

    h1 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 42px;
      font-weight: normal;

      color: #1d323b;
    }

    .role {
      margin-top: 15px;

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #56676d;
    }

    .company {
      margin-top: 8px;

      font-size: 14px;

      color: #858b89;
    }

    .line {
      height: 1px;

      margin: 35px 0;

      background: #ddd9d0;
    }

    .label {
      margin-bottom: 6px;

      font-size: 10px;
      font-weight: bold;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #a08b69;
    }

    .contact {
      margin-bottom: 22px;

      font-size: 15px;
    }

    .contact a {
      color: #26383f;

      text-decoration: none;
    }

    .contact a:hover {
      color: #a18150;
    }

    .buttons {
      margin-top: 35px;
    }

    .button {
      display: block;

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      text-align: center;

      font-size: 12px;
      font-weight: bold;

      letter-spacing: 1.2px;
      text-transform: uppercase;

      text-decoration: none;

      transition: 0.2s ease;
    }

    .linkedin {
      background: #263f49;
      color: #ffffff;
    }

    .linkedin:hover {
      background: #355662;
      color: #ffffff;
    }

    .contacts {
      border: 1px solid #cfcac0;

      background: #ffffff;
      color: #263f49;
    }

    .contacts:hover {
      border-color: #a18150;
      color: #a18150;
    }

    .footer {
      margin-top: 40px;
      padding-top: 18px;

      border-top: 1px solid #e5e2dc;

      display: flex;
      justify-content: space-between;

      font-size: 10px;

      letter-spacing: 1px;
      text-transform: uppercase;

      color: #aaa9a3;
    }

    @media (max-width: 550px) {
      .card {
        padding: 40px 25px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="gold-line"></div>

    <div class="monogram">KK</div>

    <h1>Klea Kalemi</h1>

    <div class="role">
      Project &amp; Proposal Manager
    </div>

    <div class="company">
      Symbiotics Group SA
    </div>

    <div class="line"></div>

    <div class="label">Email</div>

    <div class="contact">
      <a href="mailto:klea.kalemi@symbioticsgroup.com">
        klea.kalemi@symbioticsgroup.com
      </a>
    </div>

    <div class="label">Telephone</div>

    <div class="contact">
      <a href="tel:+41225665800">
        +41 (0)22 566 58 00
      </a>
    </div>

    <div class="buttons">

      <a
        class="button linkedin"
        href="https://www.linkedin.com/in/klea-kalemi/"
        target="_blank"
        rel="noopener noreferrer">
        LinkedIn
      </a>

      <a
        class="button contacts"
        href="contact.vcf"
        download>
        Add to Contacts
      </a>

    </div>

    <div class="footer">
      <span>Symbiotics Group SA</span>
      <span>CH</span>
    </div>

  </div>

</body>
</html>
