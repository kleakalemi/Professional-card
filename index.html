<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klea Kalemi | Symbiotics Group SA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background: #f5f4f1;
      color: #1d2529;

      font-family: "Inter", -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .card {
      position: relative;

      width: 100%;
      max-width: 520px;

      padding: 58px 56px 50px;

      background: #fbfaf7;

      border: 1px solid #dedbd3;

      box-shadow:
        0 24px 60px rgba(25, 32, 35, 0.08);
    }

    /* Subtle Swiss-style top rule */
    .top-rule {
      width: 100%;
      height: 3px;

      position: absolute;
      top: 0;
      left: 0;

      background: #b49a6a;
    }

    .monogram {
      margin-bottom: 34px;

      font-family: "Playfair Display", Georgia, serif;

      font-size: 22px;
      letter-spacing: 4px;

      color: #263c45;
    }

    .name {
      margin: 0;

      font-family: "Playfair Display", Georgia, serif;

      font-size: 42px;
      line-height: 1.1;
      font-weight: 500;

      letter-spacing: -0.5px;

      color: #182c34;
    }

    .role {
      margin-top: 16px;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #53636a;
    }

    .company {
      margin-top: 8px;

      font-size: 14px;
      letter-spacing: 0.2px;

      color: #7b817f;
    }

    .rule {
      width: 100%;
      height: 1px;

      margin: 38px 0 30px;

      border: 0;

      background: #d9d5cc;
    }

    .details {
      display: grid;
      gap: 20px;
    }

    .detail-label {
      margin-bottom: 5px;

      font-size: 10px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 1.6px;

      color: #9a927f;
    }

    .detail-value {
      font-size: 14px;
      line-height: 1.5;

      color: #26383f;
    }

    .detail-value a {
      color: inherit;
      text-decoration: none;

      border-bottom: 1px solid transparent;

      transition:
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .detail-value a:hover {
      color: #9b8153;
      border-bottom-color: #9b8153;
    }

    .actions {
      display: grid;
      gap: 10px;

      margin-top: 38px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 46px;

      padding: 12px 18px;

      text-decoration: none;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 1px;
      text-transform: uppercase;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: #263c45;
      color: #ffffff;
    }

    .primary:hover {
      background: #344f59;
      color: #ffffff;
    }

    .secondary {
      border: 1px solid #c9c5bb;
      color: #263c45;
      background: transparent;
    }

    .secondary:hover {
      border-color: #9b8153;
      color: #9b8153;
      background: #faf8f3;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 42px;
      padding-top: 18px;

      border-top: 1px solid #e1ded7;

      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;

      color: #aaa69d;
    }

    .swiss-mark {
      font-size: 11px;
      letter-spacing: 2px;
      color: #9b8153;
    }

    @media (max-width: 560px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 44px 28px 38px;
      }

      .name {
        font-size: 35px;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="top-rule"></div>

    <div class="monogram">KK</div>

    <h1 class="name">Klea Kalemi</h1>

    <div class="role">
      Project &amp; Proposal Manager
    </div>

    <div class="company">
      Symbiotics Group SA
    </div>

    <hr class="rule">

    <section class="details">

      <div>
        <div class="detail-label">Email</div>
        <div class="detail-value">
          <a href="mailto:klea.kalemi@symbioticsgroup.com">
            klea.kalemi@symbioticsgroup.com
          </a>
        </div>
      </div>

      <div>
        <div class="detail-label">Telephone</div>
        <div class="detail-value">
          <a href="tel:+41225665800">
            +41 (0)22 566 58 00
          </a>
        </div>
      </div>

    </section>

    <div class="actions">

      <a
        class="button primary"
        href="https://www.linkedin.com/in/klea-kalemi/"
        target="_blank"
        rel="noopener noreferrer">
        LinkedIn
      </a>

      <a
        class="button secondary"
        href="contact.vcf"
        download>
        Add to Contacts
      </a>

    </div>

    <div class="footer">
      <span>Symbiotics Group SA</span>
      <span class="swiss-mark">CH · 2026</span>
    </div>

  </main>

</body>
</html>
